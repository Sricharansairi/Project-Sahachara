[project]
name = "mitra-backend"
version = "0.2.0"
description = "MITRA Cloud Brain & Agent Service (Project Sahachara)"
authors = [{ name = "Project Sahachara Team" }]
requires-python = ">=3.11"
dependencies = [
    # Core web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "sse-starlette>=2.1.3",
    # Structured logging
    "structlog>=24.4.0",
    # NIM / OpenAI-compatible client
    "openai>=1.51.0",
    # LangGraph + LangChain agent orchestration
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-community>=0.3.0",
    # Vector DB (local)
    "chromadb>=0.5.0",
    # BM25 keyword search
    "rank-bm25>=0.2.2",
    # Metrics
    "prometheus-client>=0.21.0",
    # SQLite async
    "aiosqlite>=0.20.0",
    # Phase 4: Voice pipeline
    "openai-whisper>=20231117",   # local Whisper fallback STT
    "python-multipart>=0.0.9",   # required for UploadFile (STT audio upload)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
